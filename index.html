* { box-sizing: border-box; margin: 0; padding: 0; }

input[type="range"].fader {

.knob-row { width: 100%; display: flex; flex-direction: column; align-items: center; margin: 3px 0; }
.knob-row label { font-size: 0.75em; opacity: 0.8; }
input[type="range"]:not(.fader) { width: 88%; accent-color: var(--gold); height: 5px; }
.meter { width: 7px; height: 55px; background: #1a1a1a; border: 1px solid var(--gold); position: relative; margin: 5px 0; }
.meter-fill { position: absolute; bottom: 0; width: 100%; background: linear-gradient(to top, var(--led), var(--gold)); height: 0%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; width: 100%; margin-top: 6px; }
button {
  background: #1a1a1a; color: var(--text); border: 1px solid var(--gold);
  padding: 4px 7px; border-radius: 2px; font-size: 0.9em; cursor: pointer; font-family: inherit;
}
button:hover { background: var(--gold); color: #000; }
.master-section {
  background: linear-gradient(180deg, #111 0%, #000 100%);
  border: 2px solid var(--gold);
  padding: 14px; border-radius: 6px; box-shadow: var(--glow);
  display: flex; flex-wrap: wrap; gap: 18px; justify-content: space-around; align-items: center;

.color-controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
.color-controls label { font-size: 0.9em; }
.modal {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center;
}
.modal-content {
  background: #111; border: 2px solid var(--gold); padding: 25px; max-width: 700px; max-height: 80vh;

let audioCtx, masterGainNode;
let nodes = [];

function getCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGainNode = audioCtx.createGain();
    masterGainNode.gain.value = 0.65;
    masterGainNode.connect(audioCtx.destination);
    document.getElementById('masterGain').oninput = e => masterGainNode.gain.value = e.target.value;
  }
  return audioCtx;
}

function createSVG(path) {
  return `<svg viewBox="0 0 100 100"><path d="${path}" fill="none" stroke="#ffd700" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function buildChannel(t, i) {
  const div = document.createElement('div');
  div.className = 'channel';
  div.innerHTML = `
    <div class="symbol-box" onclick="openModal(${i})">${createSVG(t.path)}</div>
    <div class="ch-name">${t.name}</div>
    <div class="ch-meaning">${t.meaning}</div>
    <div class="freq" id="freq-${i}">${t.base} Hz</div>
    <div class="fader-container">
      <input type="range" class="fader" min="0" max="1" step="0.01" value="0.35" id="gain-${i}">
    </div>
    <div class="knob-row"><label>Pan</label><input type="range" min="-1" max="1" step="0.01" value="0" id="pan-${i}"></div>
    <div class="knob-row"><label>Delay</label><input type="range" min="0" max="0.8" step="0.01" value="0.18" id="delay-${i}"></div>
    <div class="knob-row"><label>FB</label><input type="range" min="0" max="0.65" step="0.01" value="0.22" id="fb-${i}"></div>
    <div class="knob-row"><label>LFO</label><input type="range" min="0" max="8" step="0.1" value="1.0" id="lfo-${i}"></div>
    <div class="knob-row"><label>Rev</label><input type="range" min="0" max="0.55" step="0.01" value="0.12" id="rev-${i}"></div>
    <div class="meter"><div class="meter-fill" id="meter-${i}"></div></div>
    <div class="btn-row">
      <button onclick="toggleTone(${i})">Tone</button>
    </div>
  `;
  return div;
}

function openModal(i) {
  document.getElementById('modalTitle').textContent = deep[i].name + " Tone";
  document.getElementById('modalBody').innerHTML = deep[i].deep;
  document.getElementById('modal').style.display = 'flex';
  window.currentDeep = deep[i];
}
function closeModal() { 
  document.getElementById('modal').style.display = 'none'; 
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}
window.onclick = e => { if (e.target.id === 'modal') closeModal(); };

function readAloud() {
  if (!window.currentDeep) return;
  const text = document.getElementById('modalTitle').textContent + ". " + 
               document.getElementById('modalBody').innerText;
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 0.9;
    utter.pitch = 1;
    window.speechSynthesis.speak(utter);
  } else {
    alert("Read aloud not supported in this browser.");
  }
}

function shareContent() {
  if (!window.currentDeep) return;
  const title = window.currentDeep.name + " Tone — FREQUENCY 13";
  const text = window.currentDeep.meaning + "\n\n" + document.getElementById('modalBody').innerText.substring(0, 300) + "...";
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title, text, url }).catch(() => {});
  } else {
    const full = title + "\n\n" + text + "\n\n" + url;
    navigator.clipboard.writeText(full).then(() => alert("Copied to clipboard for sharing."));
  }
}

function setupNode(i) {
  const ctx = getCtx();
  if (!nodes[i]) {
    const gain = ctx.createGain();
    const pan = ctx.createStereoPanner();
    const delay = ctx.createDelay(1.0);
    const fb = ctx.createGain();
    const rev = ctx.createGain();
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();

    gain.connect(pan);
    pan.connect(delay);
    delay.connect(fb);
    fb.connect(delay);
    delay.connect(rev);
    rev.connect(masterGainNode);
    pan.connect(masterGainNode);

    lfo.connect(lfoGain);
    lfoGain.connect(delay.delayTime);
    lfo.start();

    nodes[i] = { gain, pan, delay, fb, rev, lfo, lfoGain };

    document.getElementById(`gain-${i}`).oninput = e => nodes[i].gain.gain.value = e.target.value;
    document.getElementById(`pan-${i}`).oninput = e => nodes[i].pan.pan.value = e.target.value;
    document.getElementById(`delay-${i}`).oninput = e => nodes[i].delay.delayTime.value = e.target.value;
    document.getElementById(`fb-${i}`).oninput = e => nodes[i].fb.gain.value = e.target.value;
    document.getElementById(`lfo-${i}`).oninput = e => { nodes[i].lfo.frequency.value = e.target.value; nodes[i].lfoGain.gain.value = 0.04; };
    document.getElementById(`rev-${i}`).oninput = e => nodes[i].rev.gain.value = e.target.value;
  }
  return nodes[i];
}

function toggleTone(i) {
  const ctx = getCtx();
  const n = setupNode(i);
  if (n.osc) {
    n.osc.stop(); n.osc = null;
    document.getElementById(`freq-${i}`).style.color = 'var(--gold-bright)';
    document.getElementById(`meter-${i}`).style.height = '0%';
    return;
  }
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = deep[i].base;
  osc.connect(n.gain);
  osc.start();
  n.osc = osc;
  document.getElementById(`freq-${i}`).style.color = '#0f0';
  const meter = document.getElementById(`meter-${i}`);
  const anim = () => { if (!n.osc) return; meter.style.height = (28 + Math.random()*42) + '%'; requestAnimationFrame(anim); };
  anim();
}

function stopAll() {
  nodes.forEach((n, i) => {
    if (n && n.osc) { n.osc.stop(); n.osc = null; }
    const m = document.getElementById(`meter-${i}`); if (m) m.style.height = '0%';
  });
  document.querySelectorAll('.freq').forEach(el => el.style.color = 'var(--gold-bright)');
  document.getElementById('status').textContent = 'All silenced.';
}

function playAll() {
  deep.forEach((_, i) => { if (!nodes[i] || !nodes[i].osc) toggleTone(i); });
  document.getElementById('status').textContent = 'All channels engaged.';
}

document.getElementById('stopAll').onclick = stopAll;
document.getElementById('playAll').onclick = playAll;

document.getElementById('bgColor').oninput = e => {
  document.documentElement.style.setProperty('--bg', e.target.value);
  document.body.style.background = `radial-gradient(ellipse at 50% 0%, #1a1106 0%, ${e.target.value} 70%)`;
};
document.getElementById('textColor').oninput = e => {
  document.documentElement.style.setProperty('--text', e.target.value);
  document.documentElement.style.setProperty('--gold', e.target.value);
};

const container = document.getElementById('channels');
deep.forEach((t, i) => container.appendChild(buildChannel(t, i)));
</script>
</body>
</html>
